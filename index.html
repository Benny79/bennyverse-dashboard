<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BennyVerse status board</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#d8dee6; --dim:#8b95a3; --teal:#3fb8af; --amber:#e0a53a; --red:#e5534b; --green:#46b36b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0 12px 0 0; color:var(--teal); }
  main { max-width:1100px; margin:0 auto; padding:16px 20px 60px; }
  h2 { font-size:15px; margin:28px 0 8px; color:var(--amber); font-weight:600; }
  h3 { font-size:13px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  a { color:var(--teal); text-decoration:none; } a:hover { text-decoration:underline; }
  button, input { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:5px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--teal); } button:disabled { opacity:.5; cursor:default; }
  input { min-width:260px; }
  .dim { color:var(--dim); } .err { color:var(--red); } .ok { color:var(--green); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .card .ver { font-size:20px; font-weight:600; }
  .badge { display:inline-block; border-radius:10px; padding:0 8px; font-size:12px; border:1px solid var(--line); margin-right:4px; white-space:nowrap; }
  .badge.good { color:var(--green); border-color:var(--green); } .badge.bad { color:var(--red); border-color:var(--red); } .badge.warn { color:var(--amber); border-color:var(--amber); }
  .issue { display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--panel); }
  .issue:first-of-type { border-top-left-radius:6px; border-top-right-radius:6px; } .issue:last-child { border-bottom:0; border-bottom-left-radius:6px; border-bottom-right-radius:6px; }
  .issue.next { border-left:3px solid var(--amber); }
  .issue .meta { grid-column:1; font-size:12px; color:var(--dim); }
  .issue .act { grid-row:1 / span 2; grid-column:2; align-self:center; display:flex; gap:6px; }
  .hot { color:var(--red); font-weight:700; margin-right:6px; letter-spacing:1px; }
  button.high.active { background:var(--red); color:#fff; border-color:var(--red); font-weight:600; }
  button.park.active { background:var(--dim); color:#111; border-color:var(--dim); font-weight:600; }
  .issue .blockers { grid-column:1 / span 2; font-size:12px; }
  button.addr.active { background:var(--amber); color:#111; border-color:var(--amber); font-weight:600; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--dim); }
  ul.plain { list-style:none; padding:0; margin:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  ul.plain li { padding:6px 10px; border-bottom:1px solid var(--line); } ul.plain li:last-child { border-bottom:0; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:16px; }
  .tabs button.on { background:var(--teal); color:#111; border-color:var(--teal); font-weight:600; }
  .patch { background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:8px; padding:6px 10px; }
  .patch summary { color:var(--text); } .patch ul { margin:4px 0 8px; padding-left:20px; }
  .patch h4 { margin:10px 0 2px; font-size:13px; }
  #status { margin-left:auto; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>BennyVerse status board</h1>
  <input id="tokenBox" type="password" placeholder="Paste GitHub token" autocomplete="off">
  <button id="saveToken">Save token</button>
  <button id="forgetToken">Forget token</button>
  <button id="refresh">Refresh</button>
  <span id="status" class="dim"></span>
</header>
<main id="main"><p class="dim">Paste your GitHub token above to load the board.</p></main>

<script>
"use strict";
const REPO = "Benny79/bennyverse";
const BRANCH = "main";
const API = "https://api.github.com";
const ROLES = ["story", "art", "audio", "gameplay", "building", "ui", "tools", "director"];
const PARKED = "parked", DO_NEXT = "do-next", HIGH = "high-priority";
const TOKEN_KEY = "bennyverse-dashboard-token";

// ---------- token storage (browser only; never in code) ----------
let memToken = "";
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || memToken; } catch (e) { return memToken; } }
function setToken(t) { memToken = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

// ---------- GitHub API ----------
async function gh(path, opts = {}) {
  const res = await fetch(path.startsWith("http") ? path : API + path, {
    method: opts.method || "GET", cache: "no-store",
    headers: Object.assign({
      "Authorization": "Bearer " + getToken(),
      "Accept": opts.accept || "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    }, opts.body ? { "Content-Type": "application/json" } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); if (j.message) msg += ": " + j.message; } catch (e) {}
    if (res.status === 401) msg += " (token missing, wrong or expired)";
    if (res.status === 404) msg += " (wrong path, or the token can't see this repo or permission)";
    const err = new Error(msg + " [" + path.split("?")[0] + "]"); err.status = res.status; throw err;
  }
  if (res.status === 204) return null;
  if (opts.raw) return res.text();
  return res.json();
}
async function ghAll(path) { // follow pagination
  let out = [], url = path;
  while (url) {
    const res = await fetch(url.startsWith("http") ? url : API + url, { cache: "no-store", headers: {
      "Authorization": "Bearer " + getToken(), "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });
    if (!res.ok) {
      let m = res.status + " " + res.statusText; try { m += ": " + (await res.json()).message; } catch (e) {}
      if (res.status === 401) m += " (token wrong, expired or revoked)";
      if (res.status === 404) m += " (this token can't see " + REPO + ": check the token's repository access and that Issues is allowed)";
      throw new Error(m + " [" + path.split("?")[0] + "]");
    }
    out = out.concat(await res.json());
    const next = (res.headers.get("Link") || "").match(/<([^>]+)>;\s*rel="next"/);
    url = next ? next[1] : null;
  }
  return out;
}

// ---------- pure helpers (no DOM) ----------
function labelNames(issue) { return issue.labels.map(l => (typeof l === "string" ? l : l.name)); }
function parseBlockers(body) {
  // lines starting "Blocked by:" or "Depends on:" -> issue numbers
  const nums = [];
  for (const line of String(body || "").split(/\r?\n/)) {
    const m = line.match(/^\s*(?:[-*>]\s*)?(?:\*\*)?(blocked by|depends on)(?:\*\*)?\s*:\s*(.*)$/i);
    if (!m) continue;
    for (const n of m[2].matchAll(/#(\d+)/g)) { const k = Number(n[1]); if (!nums.includes(k)) nums.push(k); }
  }
  return nums;
}
function groupByRole(issues) {
  const groups = {}; ROLES.forEach(r => groups[r] = []); groups["no role"] = [];
  for (const i of issues) {
    const names = labelNames(i); const roles = names.filter(n => ROLES.includes(n));
    for (const r of (roles.length ? roles : ["no role"])) groups[r].push(i);
  }
  for (const k in groups) groups[k].sort((a, b) =>
    (labelNames(b).includes(DO_NEXT) - labelNames(a).includes(DO_NEXT)) ||
    (labelNames(b).includes(HIGH) - labelNames(a).includes(HIGH)) || (new Date(b.updated_at) - new Date(a.updated_at)));
  return groups;
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return "just now"; if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago";
}
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

// ---------- tiny DOM builder (text only, so nothing from GitHub is ever parsed as HTML) ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
function link(href, text) { return el("a", { href, target: "_blank", rel: "noopener" }, text); }
function badge(text, cls) { return el("span", { class: "badge " + (cls || "") }, text); }
const $status = document.getElementById("status");
function setStatus(t, bad) { $status.textContent = t; $status.className = bad ? "err" : "dim"; }

// ---------- data loading ----------
let data = null;
async function load() {
  setStatus("Loading…");
  const since = new Date(Date.now() - 7 * 864e5).toISOString();
  const verFiles = { game: "package.json", launcher: "launcher/package.json", editor: "launcher/editor/version.json" };
  const [openRaw, closedRaw, commits, runs, releases, ...vers] = await Promise.all([
    ghAll(`/repos/${REPO}/issues?state=open&per_page=100`),
    ghAll(`/repos/${REPO}/issues?state=closed&since=${since}&per_page=100`),
    gh(`/repos/${REPO}/commits?sha=${BRANCH}&per_page=20`),
    gh(`/repos/${REPO}/actions/workflows/release.yml/runs?per_page=1`),
    gh(`/repos/${REPO}/releases?per_page=100`).catch(() => []),
    ...Object.values(verFiles).map(p => gh(`/repos/${REPO}/contents/${p}?ref=${BRANCH}`, { accept: "application/vnd.github.raw+json", raw: true })
      .then(t => JSON.parse(t).version).catch(e => "error: " + e.message)),
  ]);
  const open = openRaw.filter(i => !i.pull_request);
  const closed = closedRaw.filter(i => !i.pull_request && i.closed_at && i.closed_at >= since);
  const run = runs.workflow_runs[0] || null;
  let jobs = [];
  if (run) jobs = (await gh(`/repos/${REPO}/actions/runs/${run.id}/jobs`)).jobs;
  // blockers: look up any referenced issue that isn't in the open list
  const openByNum = new Map(open.map(i => [i.number, i]));
  const blockInfo = new Map(); // issue number -> [{num,title,state}]
  const need = new Set();
  for (const i of open) for (const n of parseBlockers(i.body)) if (!openByNum.has(n)) need.add(n);
  const fetched = new Map();
  await Promise.all([...need].map(async n => {
    try { const x = await gh(`/repos/${REPO}/issues/${n}`); fetched.set(n, { num: n, title: x.title, state: x.state, url: x.html_url }); }
    catch (e) { fetched.set(n, { num: n, title: "(couldn't load)", state: "unknown", url: `https://github.com/${REPO}/issues/${n}` }); }
  }));
  for (const i of open) {
    const list = parseBlockers(i.body).map(n => openByNum.has(n)
      ? { num: n, title: openByNum.get(n).title, state: "open", url: openByNum.get(n).html_url } : fetched.get(n));
    if (list.length) blockInfo.set(i.number, list);
  }
  data = { open, closed, commits, run, jobs, blockInfo, releases: releases.filter(r => !r.draft), versions: Object.fromEntries(Object.keys(verFiles).map((k, idx) => [k, vers[idx]])) };
  lastLoad = Date.now();
  setStatus("Updated " + new Date().toLocaleTimeString() + " · auto-refresh every 60 s");
}

// ---------- rendering ----------
function renderReleases() {
  const jobFor = { game: "release", launcher: "launcher", editor: "editor" };
  const cards = Object.keys(data.versions).map(k => {
    const job = data.jobs.find(j => j.name === jobFor[k]);
    let state;
    if (!data.run) state = badge("no Release run found", "warn");
    else if (!job) state = badge("job not found", "warn");
    else if (job.status !== "completed") state = badge("running…", "warn");
    else if (job.conclusion === "success") {
      const pub = job.steps.some(s => /^Publish/.test(s.name) && s.conclusion === "success");
      state = [badge("passed", "good"), el("span", { class: "dim" }, pub ? "published a release" : "already released, nothing to do")];
    } else state = badge(job.conclusion || "unknown", "bad");
    return el("div", { class: "card" },
      el("div", { class: "dim" }, k),
      el("div", { class: "ver" }, String(data.versions[k]).startsWith("error") ? "?" : "v" + data.versions[k]),
      String(data.versions[k]).startsWith("error") ? el("div", { class: "err" }, data.versions[k]) : null,
      el("div", null, state),
      data.run ? el("div", { class: "dim" }, "latest run ", link(data.run.html_url, "#" + data.run.run_number), " · " + ago(data.run.created_at)) : null);
  });
  return el("div", { class: "cards" }, cards);
}
let busy = false, lastLoad = 0;
const REFRESH_MS = 60000;
function labelButton(issue, cls, label, onText, offText, titleOn, titleOff, toggle) {
  const active = labelNames(issue).includes(label);
  const b = el("button", { class: cls + (active ? " active" : ""), title: active ? titleOn : titleOff }, active ? onText : offText);
  b.addEventListener("click", async () => {
    b.disabled = true; busy = true;
    setStatus("Updating #" + issue.number + "…");
    try {
      await toggle(issue, active); await refreshAll();
      setStatus("#" + issue.number + ": " + label + (active ? " removed" : " added") + " (" + new Date().toLocaleTimeString() + ")");
    } catch (e) { setStatus("Couldn't update #" + issue.number + ": " + e.message, true); b.disabled = false; }
    finally { busy = false; }
  });
  return b;
}
const addressButton = i => labelButton(i, "addr", DO_NEXT, "\u2713 Address this", "Address this", "Click to remove do-next", "Label do-next and comment", toggleDoNext);
const highButton = i => labelButton(i, "high", HIGH, "\u2713 High priority", "High priority", "Click to remove high priority", "Mark high priority", toggleHigh);
const parkButton = i => labelButton(i, "park", PARKED, "Unpark", "Park this", "Click to take this off hold", "Put this issue on hold", togglePark);
function issueRow(issue, withButton) {
  const names = labelNames(issue);
  const blockers = data.blockInfo.get(issue.number);
  const unresolved = blockers && blockers.some(b => b.state !== "closed");
  return el("div", { class: "issue" + (names.includes(DO_NEXT) ? " next" : "") },
    el("div", null, names.includes(HIGH) ? el("span", { class: "hot", title: "High priority" }, "!!!") : null, link(issue.html_url, "#" + issue.number), " ", issue.title),
    el("div", { class: "meta" }, names.map(n => badge(n, n === DO_NEXT ? "warn" : "")), "updated " + ago(issue.updated_at)),
    withButton ? el("div", { class: "act" }, addressButton(issue), highButton(issue), parkButton(issue))
      : (names.includes(PARKED) ? el("div", { class: "act" }, parkButton(issue)) : null),
    blockers ? el("div", { class: "blockers" },
      unresolved ? badge("blocked", "bad") : badge("blockers cleared", "good"),
      blockers.map(b => el("span", null, link(b.url, "#" + b.num), " " + b.title + " ", badge(b.state, b.state === "closed" ? "good" : b.state === "open" ? "bad" : "warn"), " "))) : null);
}
function render() {
  const y = window.scrollY;
  const main = document.getElementById("main"); main.replaceChildren();
  const live = data.open.filter(i => !labelNames(i).includes(PARKED));
  const parked = data.open.filter(i => labelNames(i).includes(PARKED));
  main.append(el("h2", null, "Release status"), renderReleases());

  main.append(el("h2", null, `Open issues by role (${live.length})`));
  const groups = groupByRole(live);
  for (const r of [...ROLES, "no role"]) {
    if (!groups[r].length) continue;
    main.append(el("h3", null, `${r} · ${groups[r].length}`), el("div", null, groups[r].map(i => issueRow(i, true))));
  }
  if (!live.length) main.append(el("p", { class: "dim" }, "No open issues."));

  const det = el("details", null, el("summary", null, `Parked (${parked.length})`), el("div", null, parked.map(i => issueRow(i, false))));
  det.open = parkedOpen;
  det.addEventListener("toggle", () => { parkedOpen = det.open; });
  main.append(el("h2", null, "On hold"), det);

  const blocked = data.open.filter(i => data.blockInfo.has(i.number));
  main.append(el("h2", null, `Blockers (${blocked.length})`),
    blocked.length ? el("div", null, blocked.map(i => issueRow(i, false))) : el("p", { class: "dim" }, 'No issue has a "Blocked by:" or "Depends on:" line.'));

  main.append(el("h2", null, "Recent activity"), el("div", { class: "cols" },
    el("div", null, el("h3", null, "Last 20 commits on main"), el("ul", { class: "plain" }, data.commits.map(c =>
      el("li", null, el("span", { class: "dim" }, ago(c.commit.author.date) + " · "), link(c.html_url, c.commit.message.split("\n")[0]))))),
    el("div", null, el("h3", null, `Closed in the last 7 days (${data.closed.length})`),
      data.closed.length ? el("ul", { class: "plain" }, data.closed.map(i =>
        el("li", null, el("span", { class: "dim" }, ago(i.closed_at) + " · "), link(i.html_url, "#" + i.number + " " + i.title)))) : el("p", { class: "dim" }, "Nothing closed."))));
  main.append(el("h2", null, "Patch notes"), renderPatchNotes());
  window.scrollTo(0, y);
}

// ---------- patch notes ----------
let patchKind = "game";
const patchOpen = new Map(); // tag -> open?
let parkedOpen = false;
const patchCache = new Map(); // tag -> { bugs, features, other }
const KINDS = { game: /^v\d/, launcher: /^launcher-v/, editor: /^editor-v/ };
const BUG_RE = /\b(fix(es|ed|ing)?|bugs?|crash(es|ed)?|broken|regression|glitch|stuck)\b/i;
const FEAT_RE = /\b(add(s|ed)?|new|features?|implement(s|ed)?|introduc\w+|support|unlock\w*)\b/i;
function classify(text, labels) {
  if ((labels || []).some(l => /^bug$/i.test(l)) || BUG_RE.test(text)) return "bugs";
  if ((labels || []).some(l => /^(enhancement|feature)$/i.test(l)) || FEAT_RE.test(text)) return "features";
  return "other";
}
async function fetchPatch(rel, prev) {
  const out = { bugs: [], features: [], other: [], note: "" };
  let commits;
  if (prev) commits = (await gh(`/repos/${REPO}/compare/${prev.tag_name}...${rel.tag_name}`)).commits.slice().reverse();
  else { commits = await gh(`/repos/${REPO}/commits?sha=${rel.tag_name}&per_page=30`); out.note = "First release of this kind: showing its 30 latest commits."; }
  for (const c of commits) {
    const line = c.commit.message.split("\n")[0];
    if (/^Merge /.test(line)) continue;
    out[classify(line)].push({ text: line, url: c.html_url, kind: "commit" });
  }
  if (prev) {
    const from = prev.published_at || prev.created_at, to = rel.published_at || rel.created_at;
    const issues = await ghAll(`/repos/${REPO}/issues?state=closed&since=${from}&per_page=100`);
    for (const i of issues) {
      if (i.pull_request || !i.closed_at || i.closed_at <= from || i.closed_at > to) continue;
      out[classify(i.title, labelNames(i))].push({ text: "#" + i.number + " " + i.title, url: i.html_url, kind: "issue" });
    }
  }
  return out;
}
function patchSection(title, items) {
  if (!items.length) return null;
  return [el("h4", null, `${title} (${items.length})`), el("ul", null, items.map(x =>
    el("li", null, link(x.url, x.text), x.kind === "issue" ? el("span", { class: "dim" }, " · issue closed") : null)))];
}
function renderPatchBody(box, rel, prev) {
  const done = d => {
    box.replaceChildren(d.note ? el("p", { class: "dim" }, d.note) : null,
      patchSection("Bugs fixed", d.bugs), patchSection("Features added", d.features), patchSection("Other changes", d.other),
      !(d.bugs.length + d.features.length + d.other.length) ? el("p", { class: "dim" }, "No commits or closed issues found in this window.") : null,
      el("p", null, link(rel.html_url, "Open the GitHub release")));
  };
  if (patchCache.has(rel.tag_name)) return done(patchCache.get(rel.tag_name));
  box.replaceChildren(el("p", { class: "dim" }, "Loading…"));
  fetchPatch(rel, prev).then(d => { patchCache.set(rel.tag_name, d); done(d); })
    .catch(e => box.replaceChildren(el("p", { class: "err" }, "Couldn't load patch notes: " + e.message)));
}
function renderPatchNotes() {
  const wrap = el("div", null);
  const list = data.releases.filter(r => KINDS[patchKind].test(r.tag_name))
    .sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
  wrap.append(el("div", { class: "tabs" }, Object.keys(KINDS).map(k =>
    el("button", { class: k === patchKind ? "on" : "", onclick: () => { patchKind = k; render(); } }, k)), " ",
    el("span", { class: "dim" }, "Grouped from commit messages and closed issues between each release and the one before it.")));
  if (!list.length) wrap.append(el("p", { class: "dim" }, "No " + patchKind + " releases found."));
  list.forEach((rel, idx) => {
    const prev = list[idx + 1] || null;
    const box = el("div", null);
    const d = el("details", { class: "patch" },
      el("summary", null, el("strong", null, rel.tag_name), " · " + new Date(rel.published_at || rel.created_at).toLocaleDateString()), box);
    let loaded = false;
    const go = () => { if (!loaded) { loaded = true; renderPatchBody(box, rel, prev); } };
    const startOpen = patchOpen.has(rel.tag_name) ? patchOpen.get(rel.tag_name) : idx === 0;
    if (startOpen) { d.open = true; go(); }
    d.addEventListener("toggle", () => { patchOpen.set(rel.tag_name, d.open); if (d.open) go(); });
    wrap.append(d);
  });
  return wrap;
}

// ---------- "Address this" ----------
async function ensureLabel(name, color, description) {
  try { await gh(`/repos/${REPO}/labels`, { method: "POST", body: { name, color, description } }); }
  catch (e) { if (e.status !== 422) throw e; } // 422 = label already exists
}
async function setLabel(issue, name, active, color, description) {
  if (active) { await gh(`/repos/${REPO}/issues/${issue.number}/labels/${encodeURIComponent(name)}`, { method: "DELETE" }); return; }
  await ensureLabel(name, color, description);
  await gh(`/repos/${REPO}/issues/${issue.number}/labels`, { method: "POST", body: { labels: [name] } });
}
const toggleHigh = (issue, active) => setLabel(issue, HIGH, active, "e5534b", "High priority");
const togglePark = (issue, active) => setLabel(issue, PARKED, active, "8b95a3", "On hold");
async function toggleDoNext(issue, active) {
  if (active) { // second click removes the label (the earlier comment stays)
    await gh(`/repos/${REPO}/issues/${issue.number}/labels/${DO_NEXT}`, { method: "DELETE" });
    return;
  }
  try { await gh(`/repos/${REPO}/labels`, { method: "POST", body: { name: DO_NEXT, color: "e0a53a", description: "Ben asked for this to be addressed next" } }); }
  catch (e) { if (e.status !== 422) throw e; } // 422 = label already exists
  await gh(`/repos/${REPO}/issues/${issue.number}/labels`, { method: "POST", body: { labels: [DO_NEXT] } });
  await gh(`/repos/${REPO}/issues/${issue.number}/comments`, { method: "POST", body: { body: `Ben asked for this to be addressed (${today()}).` } });
}

// ---------- wiring ----------
async function refreshAll() {
  if (!getToken()) { setStatus("No token", true); return; }
  try { await load(); render(); }
  catch (e) { setStatus("Failed: " + e.message, true); }
}
document.getElementById("saveToken").onclick = () => {
  const box = document.getElementById("tokenBox"); const t = box.value.trim();
  if (t) { setToken(t); box.value = ""; refreshAll(); }
};
document.getElementById("forgetToken").onclick = () => {
  setToken(""); data = null; document.getElementById("main").replaceChildren(el("p", { class: "dim" }, "Token forgotten. Paste a token to load the board."));
  setStatus("");
};
document.getElementById("refresh").onclick = refreshAll;
if (getToken()) refreshAll();
// auto refresh: skip while the tab is hidden or a button click is in flight
setInterval(() => { if (!document.hidden && !busy && getToken()) refreshAll(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !busy && getToken() && Date.now() - lastLoad > REFRESH_MS) refreshAll();
});
</script>
